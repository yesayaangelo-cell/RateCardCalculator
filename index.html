<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RateRight - Freelance Pricing System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
        .card { background: white; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .btn-profesi { transition: all 0.2s; border: 1px solid #e5e7eb; }
        .btn-profesi.active { background-color: black; color: white; border-color: black; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-5xl mx-auto">
        <header class="mb-8 flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">RateRight</h1>
                <p class="text-gray-500 italic">"Berhenti rugi tanpa sadar"</p>
            </div>
            <div id="profesi-container" class="flex flex-wrap gap-2">
                </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="space-y-6">
                <div class="card p-6">
                    <h2 class="text-lg font-bold mb-4 flex items-center">⏱️ Waktu Kerja (Jam Real)</h2>
                    <div id="input-jam-container" class="space-y-4">
                        </div>
                    <hr class="my-4">
                    <div class="flex justify-between items-center pt-2 font-semibold">
                        <label>Rate per Jam (Rp)</label>
                        <input type="number" id="rate-jam" value="200000" class="w-32 p-2 border rounded-lg text-right focus:ring-2 focus:ring-black outline-none calc-trigger">
                    </div>
                </div>

                <div class="card p-6">
                    <h2 class="text-lg font-bold mb-4 flex items-center">💸 Cost & Overhead</h2>
                    <div class="space-y-4">
                        <div class="flex justify-between items-center text-sm">
                            <label class="text-gray-600 font-semibold text-left">Direct Cost (Transport, Alat, dll)</label>
                            <input type="number" id="direct-cost" value="200000" class="w-32 p-2 border rounded-lg text-right focus:ring-2 focus:ring-black outline-none calc-trigger">
                        </div>
                        <div class="flex justify-between items-center text-sm">
                            <label class="text-gray-600 font-semibold text-left">Overhead / Job (Listrik, Tool, dll)</label>
                            <input type="number" id="overhead-cost" value="300000" class="w-32 p-2 border rounded-lg text-right focus:ring-2 focus:ring-black outline-none calc-trigger">
                        </div>
                    </div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="card p-8 bg-black text-white h-full flex flex-col justify-between">
                    <div>
                        <p class="text-gray-400 text-sm mb-1 uppercase tracking-wider">Total Jam Kerja</p>
                        <h3 id="res-total-jam" class="text-4xl font-bold mb-6">0 jam</h3>
                        
                        <p class="text-gray-400 text-sm mb-1 uppercase tracking-wider">Base Cost (Modal Kerja)</p>
                        <h3 id="res-base-cost" class="text-4xl font-bold mb-8 text-yellow-400">Rp 0</h3>
                    </div>

                    <div class="space-y-4 pt-6 border-t border-gray-800">
                        <p class="text-sm text-gray-400 font-bold uppercase tracking-widest">Rekomendasi Jual</p>
                        <div class="flex justify-between items-center bg-gray-900 p-4 rounded-xl border border-gray-700">
                            <span>Mode Aman (+20%)</span>
                            <span id="res-aman" class="font-bold text-green-400 text-xl">Rp 0</span>
                        </div>
                        <div class="flex justify-between items-center bg-gray-900 p-4 rounded-xl border border-gray-700">
                            <span>Premium (+15% Buffer)</span>
                            <span id="res-premium" class="font-bold text-blue-400 text-xl">Rp 0</span>
                        </div>
                    </div>
                    <button onclick="copySummary()" class="mt-6 w-full py-3 bg-gray-800 hover:bg-gray-700 rounded-xl font-bold text-sm transition">Copy Ringkasan</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const dataProfesi = {
            "Designer": { b1: "Brief & Riset", v1: 1, b2: "Desain Visual", v2: 3, b3: "Revisi", v3: 1, b4: "Admin/Export", v4: 1 },
            "Video Editor": { b1: "Sorting Footage", v1: 2, b2: "Editing/Grading", v2: 4, b3: "Revisi", v3: 1, b4: "Rendering", v4: 1 },
            "Copywriter": { b1: "Riset Materi", v1: 2, b2: "Drafting", v2: 2, b3: "Self-Edit", v3: 1, b4: "Revisi Klien", v4: 1 },
            "Web Builder": { b1: "Wireframe", v1: 2, b2: "Building", v2: 6, b3: "Testing", v3: 2, b4: "Revisi", v4: 2 }
        };

        let profesiAktif = "Designer";

        function renderInputs() {
            const container = document.getElementById('input-jam-container');
            const p = dataProfesi[profesiAktif];
            container.innerHTML = `
                ${[1,2,3,4].map(i => `
                    <div class="flex justify-between items-center">
                        <label class="text-sm text-gray-600">${p['b'+i]}</label>
                        <input type="number" id="jam-${i}" value="${p['v'+i]}" class="w-20 p-2 border rounded-lg text-right focus:ring-2 focus:ring-black outline-none calc-trigger">
                    </div>
                `).join('')}
            `;
            // Re-attach listeners
            document.querySelectorAll('.calc-trigger').forEach(input => {
                input.addEventListener('input', calculate);
            });
            calculate();
        }

        function renderButtons() {
            const container = document.getElementById('profesi-container');
            container.innerHTML = Object.keys(dataProfesi).map(prof => `
                <button onclick="setProfesi('${prof}')" class="btn-profesi px-4 py-2 rounded-full text-xs font-bold ${prof === profesiAktif ? 'active' : 'bg-white text-gray-600'}">
                    ${prof}
                </button>
            `).join('');
        }

        function setProfesi(prof) {
            profesiAktif = prof;
            renderButtons();
            renderInputs();
        }

        function formatRupiah(n) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(n);
        }

        function calculate() {
            const j1 = parseFloat(document.getElementById('jam-1').value) || 0;
            const j2 = parseFloat(document.getElementById('jam-2').value) || 0;
            const j3 = parseFloat(document.getElementById('jam-3').value) || 0;
            const j4 = parseFloat(document.getElementById('jam-4').value) || 0;
            const rate = parseFloat(document.getElementById('rate-jam').value) || 0;
            const direct = parseFloat(document.getElementById('direct-cost').value) || 0;
            const overhead = parseFloat(document.getElementById('overhead-cost').value) || 0;

            const totalJam = j1 + j2 + j3 + j4;
            const baseCost = (totalJam * rate) + direct + overhead;
            const aman = baseCost * 1.2;
            const premium = aman * 1.15;

            document.getElementById('res-total-jam').innerText = totalJam.toFixed(1) + " jam";
            document.getElementById('res-base-cost').innerText = formatRupiah(baseCost);
            document.getElementById('res-aman').innerText = formatRupiah(aman);
            document.getElementById('res-premium').innerText = formatRupiah(premium);
        }

        function copySummary() {
            const summary = `Ringkasan Penawaran (${profesiAktif}):\nTotal Jam: ${document.getElementById('res-total-jam').innerText}\nBase Cost: ${document.getElementById('res-base-cost').innerText}\nHarga Aman: ${document.getElementById('res-aman').innerText}\nHarga Premium: ${document.getElementById('res-premium').innerText}`;
            navigator.clipboard.writeText(summary);
            alert("Ringkasan berhasil dicopy!");
        }

        // Init
        renderButtons();
        renderInputs();
    </script>
</body>
</html>
