        /* Background Logic */
        .dark body { background: radial-gradient(circle at top left, #1a1614, #000000); }
        html:not(.dark) body { background: radial-gradient(circle at top left, #f8fafc, #f1f5f9); }

        /* Card Adaptation */
        .card-glass { backdrop-filter: blur(16px); }
        .dark .card-glass { background: rgba(28, 25, 23, 0.6); border: 1px solid rgba(255, 255, 255, 0.08); }

        /* Input Adaptation */
        .input-glass { outline: none !important; }

        .btn-profesi.active { background: linear-gradient(135deg, #fbbf24, #d97706); border: none; color: black !important; font-weight: 800; box-shadow: 0 5px 15px rgba(245, 158, 11, 0.3); }
        
        #login-overlay { transition: opacity 0.5s ease-out, visibility 0.5s; }
        .hidden-overlay { opacity: 0; visibility: hidden; pointer-events: none; }
