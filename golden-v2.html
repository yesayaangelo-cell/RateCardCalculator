<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldenHour - Visual Pricing System</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        gold: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' },
                        dark: { 800: '#1c1917', 900: '#0c0a09' }
                    }
                }
            }
        }
    </script>

    <style>
        * { transition: background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease; font-family: 'Inter', sans-serif; }
        .dark body { background: radial-gradient(circle at top left, #1a1614, #000000); color: #e7e5e4; }
        html:not(.dark) body { background: radial-gradient(circle at top left, #f8fafc, #f1f5f9); color: #1e293b; }
        .card-glass { backdrop-filter: blur(16px); }
        .dark .card-glass { background: rgba(28, 25, 23, 0.6); border: 1px solid rgba(255, 255, 255, 0.08); }
        html:not(.dark) .card-glass { background: rgba(255, 255, 255, 0.8); border: 1px solid rgba(0, 0, 0, 0.05); box-shadow: 0 10px 40px -15px rgba(0,0,0,0.08); }
        .input-glass { outline: none !important; }
        .dark .input-glass { background: rgba(0, 0, 0, 0.4) !important; border: 1px solid rgba(255, 255, 255, 0.1) !important; color: white !important; }
        html:not(.dark) .input-glass { background: #ffffff !important; border: 1px solid rgba(0, 0, 0, 0.1) !important; color: #0f172a !important; }
        .btn-profesi.active { background: linear-gradient(135deg, #fbbf24, #d97706); border: none; color: black !important; font-weight: 800; }
        #login-overlay { transition: opacity 0.5s ease-out, visibility 0.5s; }
        .hidden-overlay { opacity: 0; visibility: hidden; pointer-events: none; }
    </style>
</head>

<body class="p-4 md:p-8 min-h-screen">

        <div class="w-full max-w-md bg-[#1c1917] border border-white/10 p-8 rounded-3xl text-center shadow-2xl">
            <h2 class="text-2xl font-black text-white mb-6 uppercase tracking-tighter italic text-gold-500">GoldenHour.</h2>
